<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | Bookstore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="container">
    <div class="card">
      <h1>Tham gia ngay!</h1>
      <p class="subtitle">Bắt đầu hành trình khám phá tri thức</p>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Họ và tên</label>
          <input type="text" id="fullName" placeholder="Nhập tên của bạn" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="tel" id="phone" placeholder="0123456789" required>
        </div>
        
        <div class="form-group">
          <label for="email">Địa chỉ Email</label>
          <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" id="submitBtn">Đăng ký tài khoản</button>
      </form>
      
      <div id="message"></div>
      
      <div class="footer-text">
        Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </div>

  <script src="auth_client.js"></script>
</body>
</html>
