<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ | Bookstore</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .welcome-card {
      text-align: center;
    }
    .user-info {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      font-size: 14px;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      margin-top: 20px;
    }
    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="container">
    <div class="card welcome-card">
      <h1 id="welcomeTitle">Xin chào!</h1>
      <p class="subtitle">Chào mừng bạn đến với hiệu sách của chúng tôi</p>
      
      <div id="authContent" class="user-info">
        Đang tải thông tin...
      </div>
      
      <a href="login.html" id="loginLink" style="display:none; text-decoration: none;">
        <button>Đăng nhập ngay</button>
      </a>
      
      <button id="logoutBtn" class="logout-btn" style="display:none;">Đăng xuất</button>
    </div>
  </div>

  <script>
    const authContent = document.getElementById('authContent');
    const loginLink = document.getElementById('loginLink');
    const logoutBtn = document.getElementById('logoutBtn');
    const welcomeTitle = document.getElementById('welcomeTitle');

    const checkAuth = async () => {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('user');

      if (!token || !userStr) {
        authContent.textContent = "Bạn chưa đăng nhập.";
        loginLink.style.display = 'block';
        return;
      }

      const user = JSON.parse(userStr);
      welcomeTitle.textContent = `Xin chào, ${user.fullName}!`;
      authContent.innerHTML = `
        <p><strong>Email:</strong> ${user.email}</p>
        <p style="margin-top: 5px; opacity: 0.7;">Bạn đã đăng nhập thành công vào hệ thống.</p>
      `;
      logoutBtn.style.display = 'block';
    };

    logoutBtn.addEventListener('click', () => {
      localStorage.clear();
      window.location.reload();
    });

    checkAuth();
  </script>
</body>
</html>
