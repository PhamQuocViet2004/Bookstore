<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Bookstore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  
  <div class="container">
    <div class="card">
      <h1>Chào mừng trở lại!</h1>
      <p class="subtitle">Đăng nhập vào tài khoản của bạn</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Địa chỉ Email</label>
          <input type="email" id="email" placeholder="example@gmail.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        
        <button type="submit" id="submitBtn">Đăng nhập</button>
      </form>
      
      <div id="message"></div>
      
      <div class="footer-text">
        Bạn chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </div>

  <script src="auth_client.js"></script>
</body>
</html>
